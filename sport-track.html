<title>sport-track</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block">
<style>
/* Layout : app mobile en colonne unique (max 560px), en-tête collant, semaines en carrousel horizontal, barre d'onglets fixe en bas */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#15202B; --muted:#66727F; --line:#D9DFE6;
  --accent:#1E4BD8; --accent-ink:#FFFFFF; --accent-soft:#E2E8FB; --star:#E9A100; --danger:#C2362B;
  /* 12 couleurs d'activité */
  --c1:#1E4BD8; --c2:#0B86CF; --c3:#0E968D; --c4:#2E8F45; --c5:#6F8217; --c6:#B98800;
  --c7:#DB6510; --c8:#CF3628; --c9:#BE1A5A; --c10:#D24F96; --c11:#7442CC; --c12:#56636F;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1318; --surface:#171E26; --ink:#E7ECF1; --muted:#8C98A5; --line:#27313C;
  --accent:#7090FF; --accent-ink:#0B1020; --accent-soft:#1C2645; --star:#F3B623; --danger:#F07A6E; --c1:#7090FF; --c2:#4DB0F0; --c3:#3CC6BB; --c4:#5CC273; --c5:#A6BB48; --c6:#EEC03A; --c7:#FF9246; --c8:#FF7A6B; --c9:#F2639C; --c10:#F48BC3; --c11:#A887FF; --c12:#9AA7B6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1318; --surface:#171E26; --ink:#E7ECF1; --muted:#8C98A5; --line:#27313C;
  --accent:#7090FF; --accent-ink:#0B1020; --accent-soft:#1C2645; --star:#F3B623; --danger:#F07A6E; --c1:#7090FF; --c2:#4DB0F0; --c3:#3CC6BB; --c4:#5CC273; --c5:#A6BB48; --c6:#EEC03A; --c7:#FF9246; --c8:#FF7A6B; --c9:#F2639C; --c10:#F48BC3; --c11:#A887FF; --c12:#9AA7B6; color-scheme:dark}

html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0;user-select:none}
.ms.fill{font-variation-settings:"FILL" 1}
.num{font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;gap:12px}
.brand{display:flex;align-items:center;justify-content:space-between}
.brand b{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wkrow{display:flex;align-items:flex-end;gap:10px}
.wkt{flex:1;min-width:0}
.wkt h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:36px;line-height:1;letter-spacing:.01em}
.wkt p{margin:4px 0 0;color:var(--muted);font-size:14px}
.nav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.nav:disabled{opacity:.35;cursor:default}
.pill{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.04em;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}

.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;align-items:end}
.bar{display:grid;gap:4px;justify-items:center}
.bar i{display:block;width:100%;border-radius:4px 4px 2px 2px;background:var(--line);min-height:3px}
.bar span{font-family:var(--font-display);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar.on i{background:var(--accent)}
.bar.on span{color:var(--ink);font-weight:600}

/* Semaine */
.weeks{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;min-width:0}
.day{display:grid;grid-template-columns:46px minmax(0,1fr) 34px;gap:10px;padding-block:10px;border-top:1px solid var(--line);align-items:start}
.dl{display:grid;justify-items:center;gap:2px;padding-top:2px}
.dl small{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dl b{font-family:var(--font-display);font-size:24px;font-weight:600;line-height:1;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.day.today .dl b{background:var(--accent);color:var(--accent-ink)}
.day.today .dl small{color:var(--accent)}
.db{display:grid;gap:6px;min-width:0}
.rest{color:var(--muted);font-size:14px;padding-top:9px}
.day.future{opacity:.45}
.add{width:34px;height:34px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--muted)}
.add:hover{border-color:var(--accent);color:var(--accent)}

.entry{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 10px 7px 7px}
.tile{width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--c,var(--accent)) 16%,var(--surface));color:var(--c,var(--accent));display:grid;place-items:center}
.et{min-width:0}
.et b{display:block;font-weight:600;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.et b em{font-style:normal;font-weight:500;color:var(--muted)}
.et span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.minis{display:flex;gap:1px;color:var(--star)}
.minis .ms{font-size:13px}
.minis .ms:not(.fill){color:var(--line)}

/* Listes (Activités, Stats) */
.page{padding-top:18px;display:grid;gap:22px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.ph h1,.ph h2{margin:0;font-family:var(--font-display);font-weight:700;letter-spacing:.01em}
.ph h1{font-size:36px;line-height:1}
.ph h2{font-size:22px}
.lbtn{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--accent);font-size:15px}
.lbtn .ms{font-size:20px}
.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;text-align:left;width:100%}
.row+.row{border-top:1px solid var(--line)}
.row .ms.chev{color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin:0}
.hint button{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* Stats */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.st small{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.st b{display:block;font-family:var(--font-display);font-weight:600;font-size:22px;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st b.good{color:var(--accent)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px 6px}
.chart svg{display:block;width:100%;height:auto}
.chart .cap{display:flex;justify-content:space-between;padding:0 6px 6px;font-size:13px;color:var(--muted)}
.hist .row{grid-template-columns:minmax(0,1fr) auto}
.hist .row span{color:var(--muted);font-size:13px}
.hist .row b{font-variant-numeric:tabular-nums;font-weight:600}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:24px 16px;text-align:center;color:var(--muted)}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{display:grid;justify-items:center;gap:2px;padding:9px 0 8px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.03em}
.tab.on{color:var(--accent)}
.tab.on .ms{font-variation-settings:"FILL" 1}

/* Feuille modale */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(8,12,18,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;margin:0 auto;max-width:560px;max-height:90dvh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:8px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sh h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.1}
.x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.fs{display:grid;gap:8px;margin-bottom:18px}
.fl{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fl span{letter-spacing:0;text-transform:none;font-weight:500;font-variant-numeric:tabular-nums}
.inp{width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
.inp:focus{outline:none;border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:72px}
.agrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ach{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:7px}
.ach .tile{width:32px;height:32px;border-radius:8px}
.ach .at{min-width:0}
.ach .at b{display:block;font-weight:600;font-size:14px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ach .at span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ach.on{border-color:var(--accent);background:var(--accent-soft)}
.ach:disabled{opacity:.4;cursor:default}
.calc{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.calc b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.sw{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.swb{aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--c);border:3px solid var(--bg);box-shadow:0 0 0 1.5px var(--line)}
.swb.on{box-shadow:0 0 0 2.5px var(--c)}
.stars{display:flex;gap:4px}
.stars button{color:var(--line)}
.stars button.on{color:var(--star)}
.stars .ms{font-size:34px}
.mrow{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mrow header{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.mrow header small{font-weight:500;color:var(--muted);margin-left:6px}
.mrow header button{color:var(--muted)}
.sets{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:start}
.sets>i{padding-top:11px}
.dur{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dur label,.sets label{display:grid;gap:3px;font-size:12px;color:var(--muted);text-align:center}
.sets i{font-style:normal;color:var(--muted)}
.sets .inp{text-align:center}
.icgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.ic{aspect-ratio:1;max-width:100%;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.ic .ms{font-size:26px}
.ic.on{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 16%,var(--surface));color:var(--c,var(--accent))}
.foot{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;padding:13px 16px;border-radius:12px;font-weight:600;font-size:16px;background:var(--surface);border:1px solid var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);flex:0 0 auto}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.err{color:var(--danger);font-size:14px;margin:0 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .weeks{scroll-behavior:smooth}
}
</style>

<div class="app" id="app"></div>
<div class="tabs"><nav id="tabs">
  <button class="tab" data-tab="week"><span class="ms">calendar_view_week</span>Semaine</button>
  <button class="tab" data-tab="acts"><span class="ms">format_list_bulleted</span>Activités</button>
  <button class="tab" data-tab="stats"><span class="ms">monitoring</span>Stats</button>
</nav></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="grip"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const ICONS=['fitness_center','exercise','directions_run','sprint','directions_bike','pool','self_improvement','sports_tennis','sports_volleyball','sports_soccer','sports_basketball','sports_handball','sports_rugby','sports_martial_arts','hiking'];
const TYPES={distance:{label:'Distance',unit:'km'},duration:{label:'Durée',unit:'h:mm:ss'},pace:{label:'Allure (calculée)',unit:'min/km'},speed:{label:'Vitesse (calculée)',unit:'km/h'},sets:{label:'Séries × kg × reps',unit:'séries × kg × reps'},number:{label:'Nombre libre',unit:''}};
const DN=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const DL=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const MS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const ML=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const KEY='sport-track-proto-v4';
/* Profils liés aux icônes : champs saisis + valeurs calculées */
const PROFILES={
  run:{label:'Course',icons:['directions_run','sprint'],fields:['dist','dur'],auto:['pace','speed']},
  bike:{label:'Vélo',icons:['directions_bike'],fields:['dur','dist'],auto:['speed']},
  swim:{label:'Natation',icons:['pool'],fields:['dur','laps'],auto:[]},
  hike:{label:'Randonnée',icons:['hiking'],fields:['dur','dist','elev'],auto:[]}};
const BDEF={dist:{name:'Distance',type:'distance',unit:'km'},dur:{name:'Durée',type:'duration',unit:''},pace:{name:'Allure',type:'pace',unit:''},speed:{name:'Vitesse moyenne',type:'speed',unit:''},laps:{name:'Longueurs',type:'number',unit:'longueurs'},elev:{name:'Dénivelé positif',type:'number',unit:'m D+'}};
const BUILTINS=Object.entries(PROFILES).flatMap(([p,P])=>[...P.fields,...P.auto].map(k=>({id:`${p}-${k}`,profile:p,...BDEF[k]})));
const COLORS=[['c1','Bleu'],['c2','Ciel'],['c3','Turquoise'],['c4','Vert'],['c5','Olive'],['c6','Moutarde'],['c7','Orange'],['c8','Rouge'],['c9','Framboise'],['c10','Rose'],['c11','Violet'],['c12','Ardoise']];
const AUTO=['pace','speed'];
const tileH=a=>`<span class="tile" style="--c:var(--${a.color||'c1'})"><span class="ms">${a.icon}</span></span>`;

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pISO=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addD(x,-((x.getDay()+6)%7))};
const isoWeek=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)};
const TODAY=new Date(), TODAY_ISO=iso(TODAY), CUR_MON=monday(TODAY);
const rangeLabel=m=>{const s=addD(m,6);return m.getMonth()===s.getMonth()?`${m.getDate()} au ${s.getDate()} ${MS[s.getMonth()]}`:`${m.getDate()} ${MS[m.getMonth()]} au ${s.getDate()} ${MS[s.getMonth()]}`};
const shortDate=s=>{const d=pISO(s);return `${d.getDate()} ${MS[d.getMonth()]}`};

/* ---------- valeurs ---------- */
const num=v=>Number(v).toLocaleString('fr-FR',{maximumFractionDigits:2});
const fDur=sec=>{const t=Math.round(sec/60);return `${Math.floor(t/60)} h ${pad(t%60)}`};
const fPace=sec=>{sec=Math.round(sec);return `${Math.floor(sec/60)}:${pad(sec%60)}`};
function fmt(m,v){switch(m.type){
  case'distance':return num(v)+' km';case'duration':return fDur(v);case'pace':return fPace(v)+' /km';
  case'speed':return num(v)+' km/h';case'sets':return `${v.s} × ${num(v.kg)} kg × ${v.r} reps`;
  default:return num(v)+(m.unit?' '+m.unit:'')}}
const yOf=(m,v)=>m.type==='sets'?v.kg:v;
function fmtY(m,y){switch(m.type){case'duration':return fDur(y);case'pace':return fPace(y);case'sets':return num(y)+' kg';default:return num(y)}}
function toRaw(m,v){if(v==null)return m.type==='sets'?{s:'',kg:'',r:''}:m.type==='duration'?{h:'',m:''}:'';
  if(m.type==='duration'){const t=Math.round(v/60);return{h:String(Math.floor(t/60)),m:String(t%60)}}
  switch(m.type){case'duration':return fDur(v);case'pace':return fPace(v);case'sets':return{s:String(v.s),kg:num(v.kg),r:String(v.r)};default:return num(v).replace(/\s/g,'')}}
const pNum=s=>{s=String(s||'').trim().replace(/\s/g,'').replace(',','.');if(!s)return null;const n=Number(s);return isFinite(n)&&n>=0?n:NaN};
const pTime=s=>{s=String(s||'').trim();if(!s)return null;const p=s.split(':');if(p.length>3||p.some(x=>!/^\d+$/.test(x.trim())))return NaN;return p.reduce((a,x)=>a*60+Number(x),0)};
function fromRaw(m,r){
  if(m.type==='sets'){const s=pNum(r.s),kg=pNum(r.kg),rp=pNum(r.r);if(s==null&&kg==null&&rp==null)return null;if([s,kg,rp].some(x=>x==null||isNaN(x)))return NaN;return{s,kg,r:rp}}
  if(m.type==='duration'){const h=pNum(r.h),mi=pNum(r.m);if(h==null&&mi==null)return null;if([h,mi].some(x=>x!=null&&(isNaN(x)||!Number.isInteger(x))))return NaN;const t=(h||0)*3600+(mi||0)*60;return t>0?t:null}
  if(m.type==='pace')return pTime(r);return pNum(r)}

function sample(){
  const activities=[
    {id:'a1',name:'Musculation',sub:'Bras / pecs',icon:'fitness_center',color:'c7'},
    {id:'a2',name:'Musculation',sub:'Dos / legs',icon:'exercise',color:'c8'},
    {id:'a3',name:'Sport collectif',sub:'Volley',icon:'sports_volleyball',color:'c6'},
    {id:'a4',name:'Tennis',sub:'',icon:'sports_tennis',color:'c4'},
    {id:'a5',name:'Cardio',sub:'Running',icon:'directions_run',color:'c1'},
    {id:'a6',name:'Yoga',sub:'',icon:'self_improvement',color:'c11'}];
  const metrics=[
    ...BUILTINS.map(b=>({...b})),
    {id:'m5',name:'Exercice biceps',type:'sets',unit:''}];
  const entries=[];const N=9;
  const push=(d,a,desc,rating,values={})=>{const s=iso(d);if(s<=TODAY_ISO)entries.push({id:uid(),date:s,activityId:a,desc,rating,values})};
  const run=(k,long)=>{const p=k/(N-1);let dist=Math.round((long?9+p*4:6+p*3+(k%3)*.3)*10)/10;let pace=Math.round(372-p*32+(k%2)*4+(long?18:0));return{'run-dist':dist,'run-dur':Math.round(dist*pace/60)*60,'run-pace':pace,'run-speed':Math.round(36000/pace)/10}};
  for(let k=0;k<N;k++){
    const mon=addD(CUR_MON,-7*(N-1-k));
    if(k===4){push(addD(mon,1),'a5','Footing tranquille en bord de mer, jambes lourdes.',3,run(k));push(addD(mon,6),'a6','Yin yoga, 45 min.',5);continue}
    push(mon,'a1',['Séance correcte, fin difficile.','Bonne énergie, progression sur le curl.','Un peu fatigué mais séance complète.'][k%3],3+(k%3===1?1:0),{m5:{s:k>=6?4:3,kg:10+Math.floor(k/2),r:k%2?10:12}});
    push(addD(mon,1),'a5',['Fractionné léger, bon rythme.','Sortie régulière, respiration OK.','Parcours vallonné.'][k%3],3+(k%2),run(k));
    if(k%2===0)push(addD(mon,2),'a2','Tirage + squats.',4);
    push(addD(mon,3),'a3','Entraînement + match en 3 sets.',k%3?4:5);
    if(k%2===0)push(addD(mon,5),'a4','Simple, beaucoup d\'échanges en fond de court.',4);
    else push(addD(mon,5),'a5','Sortie longue du week-end.',k>5?4:3,run(k,true));
    if(k%3!==1)push(addD(mon,6),'a6','Vinyasa 1 h.',5);
  }
  return{activities,metrics,entries};
}

function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r)));const f=r/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
const mLabel=m=>m.profile?`${PROFILES[m.profile].label} · ${m.name}`:m.name;
const statList=()=>[...usedProfiles().flatMap(p=>S.metrics.filter(m=>m.profile===p)),...exercises()];
function renderStats(){
  const L0=statList();if(!statMetric||!L0.some(m=>m.id===statMetric))statMetric=L0[0]&&L0[0].id;
  const m=met(statMetric);
  let body='';
  if(!m){body='<div class="empty">Ajoute un exercice dans l\'onglet Activités pour suivre ton évolution.</div>'}
  else{
    const pts=S.entries.filter(e=>e.values[m.id]!=null).sort((a,b)=>a.date<b.date?-1:1).map(e=>({d:e.date,t:pISO(e.date).getTime(),v:e.values[m.id],y:yOf(m,e.values[m.id]),a:e.activityId}));
    if(pts.length<2){body=`<div class="empty">${pts.length?'Une seule valeur pour l\'instant.':'Aucune valeur déclarée pour l\'instant.'} Il en faut au moins deux pour tracer une courbe.</div>`}
    else{
      const lowBetter=m.type==='pace';
      const ys=pts.map(p=>p.y);const best=lowBetter?Math.min(...ys):Math.max(...ys);const last=pts[pts.length-1],first=pts[0];
      const diff=last.y-first.y;const good=lowBetter?diff<0:diff>0;
      const dTxt=(diff>0?'+':diff<0?'−':'±')+fmtY(m,Math.abs(diff)).replace(/^0:/,'0:');
      const bestPt=pts.find(p=>p.y===best);
      body+=`<div class="tiles"><div class="st"><small>Dernière</small><b>${esc(fmtY(m,last.y))}</b></div>
        <div class="st"><small>Record</small><b>${esc(fmtY(m,best))}</b></div>
        <div class="st"><small>Évolution</small><b class="${good?'good':''}">${esc(dTxt)}</b></div></div>`;
      // graphique
      const W=340,H=200,L=46,R=14,T=14,B=28;
      let lo=Math.min(...ys),hi=Math.max(...ys);if(lo===hi){lo-=1;hi+=1}
      const step=niceStep((hi-lo)/3);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
      const t0=first.t,t1=last.t;
      const X=t=>L+(t-t0)/(t1-t0||1)*(W-L-R);
      const Y=y=>{const f=(y-lo)/(hi-lo);return lowBetter?T+f*(H-T-B):H-B-f*(H-T-B)};
      let g='';for(let v=lo;v<=hi+step/2;v+=step){const yy=Y(v).toFixed(1);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${+yy+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Barlow, sans-serif">${esc(fmtY(m,v).replace(' kg',''))}</text>`}
      const line=pts.map((p,i)=>`${i?'L':'M'}${X(p.t).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
      const base=(H-B).toFixed(1);
      const area=`${line}L${X(t1).toFixed(1)},${base}L${X(t0).toFixed(1)},${base}Z`;
      const mid=pts[Math.floor(pts.length/2)];
      const xl=[first,mid,last].map((p,i)=>`<text x="${X(p.t).toFixed(1)}" y="${H-8}" text-anchor="${['start','middle','end'][i]}" font-size="11" fill="var(--muted)" font-family="Barlow, sans-serif">${shortDate(p.d)}</text>`).join('');
      const dots=pts.map((p,i)=>i===pts.length-1?`<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="6" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>`:`<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.6" fill="var(--accent)"/>`).join('');
      body+=`<div class="chart"><div class="cap"><span>${esc(mLabel(m))}${m.type==='sets'?' · charge (kg)':''}</span><span>${lowBetter?'plus haut = plus rapide':pts.length+' valeurs'}</span></div>
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de ${esc(m.name)}">${g}
        <path d="${area}" fill="var(--accent)" fill-opacity=".12"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}</svg></div>`;
      body+=`<div class="ph"><h2>Historique</h2></div><div class="list hist">${pts.slice(-8).reverse().map(p=>{const a=act(p.a);return `<div class="row"><span><b style="font-weight:500;color:var(--ink)">${shortDate(p.d)}</b><br><span>${esc(a.name)}${a.sub?' · '+esc(a.sub):''}</span></span><b>${esc(fmt(m,p.v))}</b></div>`}).join('')}</div>`;
    }
  }
  $app.innerHTML=`<div class="page"><div class="ph"><h1>Statistiques</h1></div>
    <div class="chips">${statList().map(x=>`<button class="chip${x.id===statMetric?' on':''}" data-stat="${x.id}">${esc(mLabel(x))}</button>`).join('')}</div>${body}</div>`;
}

function lastMetricsFor(aid){const l=S.entries.filter(e=>e.activityId===aid).sort((a,b)=>a.date<b.date?1:-1)[0];return l?Object.keys(l.values).filter(k=>met(k)&&met(k).type==='sets'):[]}

function metInput(m){const r=draft.raw[m.id];const t=TYPES[m.type];
  const f=(part,label,mode)=>`<label><input class="inp num" inputmode="${mode}" pattern="${mode==='numeric'?'[0-9]*':''}" id="m-${m.id}-${part}" data-mi="${m.id}" data-part="${part}" value="${esc(r[part])}">${label}</label>`;

  let unit=m.type==='number'?m.unit:m.type==='sets'||m.type==='duration'?'':t.unit;if(unit&&unit.toLowerCase()===m.name.toLowerCase())unit='';

function compute(values,p){if(!p||!PROFILES[p].auto.length)return null;const km=values[`${p}-dist`],sec=values[`${p}-dur`];
  if(!(km>0)||!(sec>0))return null;const out={};if(PROFILES[p].auto.includes('pace'))out[`${p}-pace`]=Math.round(sec/km);if(PROFILES[p].auto.includes('speed'))out[`${p}-speed`]=Math.round(km/(sec/3600)*10)/10;return out}
function isTaken(dr){return S.entries.some(x=>x.date===dr.date&&x.id!==dr.id&&x.activityId===dr.activityId)}
function calcTxt(){const p=profileOf(draft.activityId);if(!p||!PROFILES[p].auto.length)return'';const vals={};
  for(const k of draft.order){const v=fromRaw(met(k),draft.raw[k]);if(typeof v==='number'&&v>0)vals[k]=v}
  const c=compute(vals,p);const names=PROFILES[p].auto.map(a=>a==='pace'?'allure':'vitesse').join(' et ');
  if(!c)return `<span>${names[0].toUpperCase()+names.slice(1)} calculée${PROFILES[p].auto.length>1?'s':''} dès que distance et durée sont remplies.</span>`;
  return '<span>Calculé :</span>'+Object.entries(c).map(([k,v])=>`<b>${esc(fmt(met(k),v))}</b>`).join('<span>·</span>')}
function saveEntry(){
  if(!draft.activityId)return drawEntry('Choisis une activité.');
  const values={};for(const k of draft.order){const m=met(k);const v=fromRaw(m,draft.raw[k]);
    if(m.type==='sets'){const r=draft.raw[k];const miss=[['s','séries'],['kg','kg'],['r','reps']].filter(([p])=>!String(r[p]).trim()).map(x=>x[1]);
      if(miss.length&&miss.length<3)return drawEntry(`« ${m.name} » : remplis aussi ${miss.join(' et ')}.`);
      if(v!==null&&(isNaN(v.s)||isNaN(v.r)||!Number.isInteger(v.s)||!Number.isInteger(v.r)||isNaN(v.kg)))return drawEntry(`« ${m.name} » : séries et reps en nombres entiers, kg en nombre (virgule acceptée).`)}
    if(m.type==='duration'&&isNaN(v))return drawEntry(`« ${m.name} » : heures et minutes en nombres entiers.`);
    if(v===null)continue;if(typeof v==='object'?Object.values(v).some(isNaN):isNaN(v))return drawEntry(`Valeur invalide pour « ${m.name} »${m.type==='duration'||m.type==='pace'?' (format attendu : 5:42 ou 1:02:10)':''}.`);
    values[k]=v}
  if(isTaken(draft))return drawEntry('Cette activité est déjà déclarée ce jour-là.');
  const c=compute(values,profileOf(draft.activityId));if(c)Object.assign(values,c);
  const rec={id:draft.id,date:draft.date,activityId:draft.activityId,desc:draft.desc.slice(0,250),rating:draft.rating,values};
  const i=S.entries.findIndex(e=>e.id===rec.id);if(i>=0)S.entries[i]=rec;else S.entries.push(rec);
  save();closeSheet();render();toast(i>=0?'Séance mise à jour':'Séance ajoutée');
}

/* activité */
function openAct(id){const a=id&&S.activities.find(x=>x.id===id);
  draft=a?{color:'c1',...a,isNew:false}:{id:uid(),name:'',sub:'',icon:ICONS[0],color:'c1',isNew:true};openSheet('act');drawAct()}
function drawAct(err){
  $sb.innerHTML=head(draft.isNew?'Nouvelle activité':'Modifier l\'activité')+
  `<div class="fs"><label class="fl" for="aName">Nom</label><input class="inp" id="aName" maxlength="40" value="${esc(draft.name)}" placeholder="Ex. Natation"></div>
   <div class="fs"><label class="fl" for="aSub">Sous-titre <span id="cSub">${draft.sub.length}/80</span></label><input class="inp" id="aSub" maxlength="80" value="${esc(draft.sub)}" placeholder="Ex. Crawl, bassin 25 m"></div>
   <div class="fs"><div class="fl">Couleur <span id="cName">${COLORS.find(c=>c[0]===draft.color)[1]}</span></div><div class="sw">${COLORS.map(([k,n])=>`<button class="swb${k===draft.color?' on':''}" style="--c:var(--${k})" data-color="${k}" aria-label="${n}"></button>`).join('')}</div></div>
   <div class="fs"><div class="fl">Icône</div><div class="icgrid" id="icg" style="--c:var(--${draft.color})">${ICONS.map(ic=>`<button class="ic${ic===draft.icon?' on':''}" data-icon="${ic}" aria-label="${ic.replace(/_/g,' ')}"><span class="ms">${ic}</span></button>`).join('')}</div><p class="hint">Les icônes course, vélo, natation et randonnée activent leurs propres mesures (durée, distance…).</p></div>
   ${err?`<p class="err">${esc(err)}</p>`:''}
   <div class="foot">${draft.isNew?'':delBtn}<button class="btn primary" data-save>Enregistrer</button></div>`}
function saveAct(){if(!draft.name.trim())return drawAct('Donne un nom à l\'activité.');
  const rec={id:draft.id,name:draft.name.trim(),sub:draft.sub.trim().slice(0,80),icon:draft.icon,color:draft.color};
  const i=S.activities.findIndex(a=>a.id===rec.id);if(i>=0)S.activities[i]=rec;else S.activities.push(rec);save();closeSheet();render();toast('Activité enregistrée')}

/* exercice */
function openMet(id){const m=id&&S.metrics.find(x=>x.id===id);
  draft=m?{...m,isNew:false}:{id:uid(),name:'',type:'sets',unit:'',isNew:true};openSheet('met');drawMet()}
function drawMet(err){
  $sb.innerHTML=head(draft.isNew?'Nouvel exercice':'Modifier l\'exercice')+
  `<div class="fs"><label class="fl" for="mName">Nom</label><input class="inp" id="mName" maxlength="40" value="${esc(draft.name)}"><p class="hint">Saisi en séries × kg × reps à chaque séance.</p></div>
   ${err?`<p class="err">${esc(err)}</p>`:''}
   <div class="foot">${draft.isNew?'':delBtn}<button class="btn primary" data-save>Enregistrer</button></div>`}
function saveMet(){if(!draft.name.trim())return drawMet('Donne un nom à l\'exercice.');
  const rec={id:draft.id,name:draft.name.trim(),type:'sets',unit:''};
  const i=S.metrics.findIndex(m=>m.id===rec.id);if(i>=0)S.metrics[i]=rec;else S.metrics.push(rec);save();closeSheet();render();toast('Exercice enregistré')}

function doDelete(){
  if(sheetKind==='entry'){S.entries=S.entries.filter(e=>e.id!==draft.id);toast('Séance supprimée')}
  if(sheetKind==='act'){S.activities=S.activities.filter(a=>a.id!==draft.id);S.entries=S.entries.filter(e=>e.activityId!==draft.id);toast('Activité supprimée')}
  if(sheetKind==='met'){S.metrics=S.metrics.filter(m=>m.id!==draft.id);S.entries.forEach(e=>delete e.values[draft.id]);toast('Exercice supprimé')}
  save();closeSheet();render()}

/* ---------- événements ---------- */
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;window.scrollTo(0,0);render()});
$app.addEventListener('click',e=>{const t=e.target;let b;
  if(b=t.closest('[data-step]'))return goWeek(wkIdx+ +b.dataset.step);
  if(b=t.closest('[data-goto]'))return goWeek(+b.dataset.goto);
  if(t.closest('[data-today]'))return goWeek(1e9);
  if(b=t.closest('[data-add]'))return openEntry(b.dataset.add);
  if(b=t.closest('[data-entry]')){const en=S.entries.find(x=>x.id===b.dataset.entry);return openEntry(en.date,en.id)}
  if(b=t.closest('[data-act]'))return openAct(b.dataset.act);
  if(t.closest('[data-newact]'))return openAct();
  if(b=t.closest('[data-met]'))return openMet(b.dataset.met);
  if(t.closest('[data-newmet]'))return openMet();
  if(b=t.closest('[data-stat]')){statMetric=b.dataset.stat;return renderStats()}
  if(b=t.closest('[data-reset]')){if(b.dataset.armed){S=sample();save();wkIdx=null;render();toast('Exemple réinitialisé')}else{b.dataset.armed=1;b.textContent='Confirmer la réinitialisation'}}
});
$scrim.addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$sheet.hidden)closeSheet()});
$sb.addEventListener('click',e=>{const t=e.target;let b;
  if(t.closest('[data-close]'))return closeSheet();
  if(b=t.closest('[data-del]')){if(b.classList.contains('armed'))return doDelete();b.classList.add('armed');b.textContent=sheetKind==='act'?'Supprimer aussi ses séances ?':sheetKind==='met'?'Supprimer aussi ses valeurs ?':'Confirmer';return}
  if(t.closest('[data-save]'))return sheetKind==='entry'?saveEntry():sheetKind==='act'?saveAct():saveMet();
  if(sheetKind==='entry'){
    if(b=t.closest('[data-pick]')){const was=draft.activityId;draft.activityId=b.dataset.pick;
      const empty=draft.order.every(k=>{const r=draft.raw[k];return typeof r==='object'?Object.values(r).every(x=>!String(x).trim()):!r});
      if(draft.isNew&&empty&&was!==draft.activityId){draft.order=[];draft.raw={}}
      syncOrder();
      return drawEntry()}
    if(b=t.closest('[data-rate]')){const v=+b.dataset.rate;draft.rating=draft.rating===v?v-1:v;return drawEntry()}
    if(b=t.closest('[data-rmmet]')){const k=b.dataset.rmmet;draft.order=draft.order.filter(x=>x!==k);delete draft.raw[k];return drawEntry()}
  }
  if(sheetKind==='act'&&(b=t.closest('[data-color]'))){draft.color=b.dataset.color;$sb.querySelectorAll('.swb').forEach(x=>x.classList.toggle('on',x===b));document.getElementById('icg').style.setProperty('--c',`var(--${draft.color})`);document.getElementById('cName').textContent=COLORS.find(c=>c[0]===draft.color)[1];return}
  if(sheetKind==='act'&&(b=t.closest('[data-icon]'))){draft.icon=b.dataset.icon;$sb.querySelectorAll('.ic').forEach(x=>x.classList.toggle('on',x===b))}
});
$sb.addEventListener('input',e=>{const t=e.target;
  if(t.id==='fDesc'){draft.desc=t.value;document.getElementById('cDesc').textContent=`${t.value.length}/250`}
  else if(t.dataset.mi){const k=t.dataset.mi;if(t.dataset.part)draft.raw[k][t.dataset.part]=t.value;else draft.raw[k]=t.value;const c=document.getElementById('calc');if(c)c.innerHTML=calcTxt()}
  else if(t.id==='aName')draft.name=t.value;
  else if(t.id==='aSub'){draft.sub=t.value;document.getElementById('cSub').textContent=`${t.value.length}/80`}
  else if(t.id==='mName')draft.name=t.value;
  else if(t.id==='mUnit')draft.unit=t.value;
});
$sb.addEventListener('change',e=>{const t=e.target;
  if(t.id==='fAddMet'&&t.value){draft.order.push(t.value);draft.raw[t.value]=toRaw(met(t.value),null);drawEntry();const f=$sb.querySelector(`[data-mi="${t.value}"]`);f&&f.focus()}
  if(t.id==='mType'){draft.type=t.value;drawMet()}
});
let rT;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if(tab==='week')renderWeek()},150)});
render();
})();
</script>
